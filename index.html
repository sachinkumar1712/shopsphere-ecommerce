
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopSphere | Online Shopping</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <header class="site-header">
        <nav class="navbar-container">
            <!-- Logo -->
            <a href="#home" class="logo">
                Shop<span>Sphere</span>
            </a>

            <!-- Desktop Navigation -->
            <ul class="nav-links" id="navLinks">
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

            <!-- Search -->
            <form class="search-box" id="searchForm">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search products..."
                    aria-label="Search products"
                >
                <button type="submit">Search</button>
            </form>

            <!-- Wishlist and Cart -->
            <div class="nav-actions">
                <button type="button" id="wishlistBtn">
                    ♡ <span class="action-label">Wishlist</span>
                </button>

                <button type="button" id="cartBtn">
                    🛒 <span class="action-label">Cart</span>
                    <span id="cartCount">0</span>
                </button>
            </div>

            <!-- Mobile Menu Button -->
            <button
                type="button"
                class="menu-toggle"
                id="menuToggle"
                aria-label="Toggle navigation menu"
                aria-controls="navLinks"
                aria-expanded="false"
            >
                ☰
            </button>

        </nav>
    </header>

    <!-- Homepage -->
    <main id="home" class="container my-5 text-center">
        <h1>Welcome to ShopSphere</h1>
        <p>Discover amazing products at great prices.</p>

        <a href="#products" class="btn btn-primary">
            Explore Products
        </a>

        <section id="products" class="mt-5">
            <h2>Our Products</h2>
            <p>Products are coming soon!</p>
        </section>

        <section id="contact" class="mt-5">
            <h2>Contact Us</h2>
            <p>Contact section coming soon!</p>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
